name: Retrain Models

on:
  schedule:
    - cron: "0 23 * * 0"   # every Sunday at 23:00 UTC = Monday 02:00 GMT+3
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest

    env:
      DEV_MODE: "false"
      # VPS MLflow server (proxied through Nginx with basic auth)
      MLFLOW_TRACKING_URI:       ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME:  ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD:  ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      # Neon database for training data (used by data_load.py)
      NEON_DATABASE_URL:         ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run training
        working-directory: backend
        run: python model/src/main.py
